pluginManagement {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'net.neoforged.moddev.repositories' version '2.0.146'
}

rootProject.name = 'create_shining_stage'

dependencyResolutionManagement {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://mirrors4.qlu.edu.cn/bmclapi/' }
        maven { url = 'https://bmclapi2.bangbang93.com/libraries/' }
        maven { url = 'https://maven.createmod.net' }
        maven { url = 'https://maven.ithundxr.dev/snapshots' }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
        }
    }
}
