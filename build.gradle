plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            // Datagen gets its own game directory instead of sharing run/ with the client: run/mods is a
            // client-side shader test setup (Iris + Sodium), and loading it here deadlocks mod construction
            // (Sodium's RenderStateShard static init vs Registrate's RenderType static init, both still
            // running in parallel on the mod-loading threads). Nothing in src/generated depends on it.
            gameDirectory = file('build/run-data')
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create dependencies
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"

    // Create: Aeronautics
    implementation "maven.modrinth:create-aeronautics:1.3.0+mc1.21.1"
    // Sable (required runtime dependency of Create: Aeronautics)
    // compile-time too: spotlight raycast uses Sable's sub-level-aware distance
    implementation("maven.modrinth:sable:${sable_version}") { transitive = false }
    // SableCompanion interface lives in sable's jarjar, not the outer jar; needed to compile against it.
    compileOnly files("libs/sable-companion-common-1.21.1-1.6.0.jar")
    // Veil draws the spotlight beam with a shader of this mod's own (see SpotlightRenderer). It is
    // shipped inside sable's jarjar (hence this vendored copy, matching sable_version) and Veil
    // loads its programs from this mod's resources, so nothing else is needed at runtime.
    compileOnly files("libs/veil-neoforge-1.21.1-4.3.2.jar")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // sponge-mixin's annotation processor exists only to emit refmaps (obfuscated-name side tables),
    // which NeoForge does not use: dev and production both run on official mappings. Left enabled it
    // fails the build on any @Inject target ("Unable to locate obfuscation mapping"), and
    // ModDevGradle only wires it up in its legacy-Forge mode anyway.
    options.compilerArgs.add('-proc:none')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
